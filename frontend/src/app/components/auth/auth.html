@if (auth.isLoggedIn()) {
  <div class="user-bar">
    <span
      >Angemeldet als <strong>{{ auth.username() }}</strong></span
    >
    <button (click)="logout()">Logout</button>
  </div>
} @else {
  <div class="auth-card">
    <h2>Login / Registrierung</h2>
    <p class="auth-description">Melde dich an oder erstelle einen neuen Account.</p>

    <div class="form-group">
      <label for="username">Benutzername</label>
      <input id="username" type="text" [(ngModel)]="username" />
    </div>

    <div class="form-group">
      <label for="password">Passwort</label>
      <input id="password" type="password" [(ngModel)]="password" />
    </div>

    <div class="auth-actions">
      <button (click)="login()">Login</button>
      <button class="secondary-button" (click)="register()">Registrieren</button>
    </div>

    @if (message) {
      <p class="auth-message">{{ message }}</p>
    }
  </div>
}
